name: Build & Push Frontend

on:
  push:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push obrazu
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/it-solution-prz/frontend:latest